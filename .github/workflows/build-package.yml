name: Build release package
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          set -x
          sudo dpkg --add-architecture i386
          sudo apt update
          source ./build_deps.sh
          DEPS="$(printf '%s' "$DEPS_DEBIAN" | tr ',' ' ')"
          sudo apt -o Acquire::Queue-Mode=access -y install \
            $DEPS \
            gh \
            pkgconf
          command -v glslangValidator && glslangValidator --version
          command -v pkg-config && pkg-config --version
      - name: Install Meson
        run: |
          MESON_MIN_VERSION="$(sed -n "s/.*meson_version:[[:space:]]*'>=\([^']*\)'.*/\1/p" meson.build)"
          python3 -m pip install --user --break-system-packages "meson>=${MESON_MIN_VERSION}"
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          meson --version
      - name: Build and package
        run: |
          ./build-source.sh
          ./build.sh build -Dwerror=true package release
      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="${GITHUB_REF##*/}"
          for pkg in ./build/*.tar.*; do
            gh release upload "$tag_name" "$pkg" --clobber
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MangoHud-${{ github.ref_name }}
          path: build/MangoHud-*tar.gz
          retention-days: 30
