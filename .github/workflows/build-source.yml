name: Build source tars
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          set -x
          sudo apt update
          source ./build_deps.sh
          DEPS_NO_I386="$(printf '%s' "$DEPS_DEBIAN" \
            | tr ',' '\n' \
            | grep -v ':i386' \
            | tr '\n' ' ')"
          sudo apt -o Acquire::Queue-Mode=access -y install \
            $DEPS_NO_I386 \
            hub
      - name: Install Meson
        run: |
          MESON_MIN_VERSION="$(sed -n "s/.*meson_version:[[:space:]]*'>=\([^']*\)'.*/\1/p" meson.build)"
          python3 -m pip install --user --break-system-packages "meson>=${MESON_MIN_VERSION}"
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          meson --version
      - name: Run build-source.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build-source.sh
          assets=()
          for asset in ./MangoHud-*-Source*.tar.*; do
            assets+=("-a" "$asset")
          done
          tag_name="${GITHUB_REF##*/}"
          hub release edit "${assets[@]}" -m "" "$tag_name"
          #hub release create "${assets[@]}" -m "$tag_name" "$tag_name"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MangoHud-${{ github.ref_name }}-Source
          path: MangoHud-*-Source*.tar.*
          retention-days: 30
